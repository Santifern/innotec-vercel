# Fix a las routes de to: ''
seo:
  title: INNOTEC 2026 — Congreso de Tecnología e Innovación
  description: El congreso anual de innovación y tecnología organizado por estudiantes de la Facultad de Ciencias y Tecnología de la Universidad Católica del Paraguay. 20 de agosto de 2026.
title: "Innovar para transformar:\ndel conocimiento a la acción"
description: INNOTEC es el congreso anual de tecnología e innovación organizado por estudiantes de la Facultad de Ciencias y Tecnología de la Universidad Católica del Paraguay. Un espacio para aprender, colaborar y liderar el cambio.
hero:
  headline: "20 de agosto, 2026 · Asunción, Paraguay"
  links:
    - label: Inscríbete ahora
      color: primary
      size: xl
      to: '/inscripciones'
    - label: Conocé más
      size: xl
      color: neutral
      variant: soft
      to: '#acerca'
features:
  headline: Actividades
  title: "Tres experiencias, un solo evento."
  description: INNOTEC 2026 te ofrece diferentes formatos para aprender, conectar y crecer en las áreas de Tecnología, Ingeniería, Arquitectura y Diseño.
  items:
    - icon: i-lucide-mic-2
      title: Charlas con Nuevas Propuestas
      description: Expertos nacionales e internacionales comparten sus conocimientos y visiones sobre las últimas tendencias en tecnología e innovación.
    - icon: i-lucide-wrench
      title: Talleres Interactivos
      description: Sesiones prácticas donde aprenderás herramientas y técnicas aplicadas directamente en proyectos reales.
    - icon: i-lucide-building-2
      title: Visitas Técnicas
      description: Recorridos a instalaciones y empresas referentes del sector tecnológico para conocer de cerca cómo se aplica la innovación.
metrics:
  headline: INNOTEC en cifras
  title: "Un congreso diseñado para inspirar."
  description: Cada edición de INNOTEC conecta a estudiantes, profesionales y expertos en un espacio de aprendizaje y colaboración único en Paraguay.
  items:
    - value: "2026"
      label: Edición anual
      class: "text-primary"
    - value: "3"
      label: Actividades principales
      class: "text-info"
    - value: "100%"
      label: Organizado por estudiantes
      class: "text-success"
    - value: "1 día"
      label: Intenso de aprendizaje
      class: "text-warning"
cta:
  title: "¿Listo para\nser parte?"
  description: Únete al congreso de tecnología e innovación más importante del Paraguay estudiantil. Inscripción abierta para estudiantes y profesionales.
  command: "20 de agosto · Asunción, Paraguay"
  links:
    - label: Inscríbete al INNOTEC 2026
      color: primary
      to: '/inscripciones'
